<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <base href="/admin/" />
    <title>TECHASTRA 2026 — Code Rescue Admin Command Center</title>
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #008080; /* Win95 Teal */
            font-family: 'MS Sans Serif', Tahoma, 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Full desktop container */
        .desktop-wrap {
            width: 100vw;
            height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        /* Standalone Win95 Window Frame */
        .standalone-win95-window {
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            box-shadow: 2px 2px 0px #000000;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 1440px;
            margin: 0 auto;
            overflow: hidden;
        }

        /* Titlebar */
        .win95-titlebar {
            background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
            color: #ffffff;
            padding: 4px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .win95-title-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .win95-title-icon {
            font-size: 14px;
        }

        .win95-window-controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .win95-win-btn {
            background-color: #c0c0c0;
            border: 1px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            width: 18px;
            height: 16px;
            font-size: 11px;
            font-weight: bold;
            line-height: 12px;
            text-align: center;
            padding: 0;
            cursor: pointer;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .win95-win-btn:active {
            border-color: #808080 #ffffff #ffffff #808080;
        }

        /* Menubar */
        .win95-menubar {
            background-color: #c0c0c0;
            border-bottom: 1px solid #808080;
            display: flex;
            padding: 2px 6px;
            gap: 12px;
            font-size: 12px;
        }

        .win95-menu-item {
            padding: 2px 6px;
            cursor: pointer;
        }

        .win95-menu-item:hover {
            background-color: #000080;
            color: #ffffff;
        }

        /* Window Content Area */
        .win95-content-area {
            flex: 1;
            overflow-y: auto;
            background-color: #c0c0c0;
            padding: 8px;
            min-height: 0;
        }

        /* Bottom Statusbar */
        .win95-statusbar {
            background-color: #c0c0c0;
            border-top: 1px solid #808080;
            padding: 2px 4px;
            display: flex;
            gap: 4px;
            font-size: 11px;
            color: #333333;
        }

        .win95-status-panel {
            border: 1px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            padding: 2px 8px;
            font-family: monospace;
        }

        .win95-status-panel.flex-1 {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="desktop-wrap">
        <div class="standalone-win95-window">
            <!-- Title Bar -->
            <div class="win95-titlebar">
                <div class="win95-title-left">
                    <span class="win95-title-icon">🛡️</span>
                    <span>TECHASTRA 2026 — Code Rescue Security &amp; Administration Desk [HQ NODE-01]</span>
                </div>
                <div class="win95-window-controls">
                    <button class="win95-win-btn" title="Minimize">_</button>
                    <button class="win95-win-btn" title="Maximize">□</button>
                    <button class="win95-win-btn" title="Lock Workstation" onclick="if(confirm('Lock administrative console?')){sessionStorage.removeItem('techastra_admin_session');location.reload();}">✕</button>
                </div>
            </div>

            <!-- Menu Bar -->
            <div class="win95-menubar">
                <div class="win95-menu-item" onclick="location.reload()">File (Refresh)</div>
                <div class="win95-menu-item" onclick="alert('Session authenticated via Encrypted Token. Inactivity timeout: 30 minutes.')">Security (Audit)</div>
                <div class="win95-menu-item" onclick="if(confirm('Log out and terminate active administrative session?')){sessionStorage.removeItem('techastra_admin_session');location.reload();}">Session (Lock / Logout)</div>
                <div class="win95-menu-item" onclick="alert('Department of Computer Science & Engineering\nTechastra 2026 Code Rescue Administration Portal\nFaculty: Dr. G. Senthil Velan, Ms. Anu\nStudent Leads: Yashvinthan M, Kavitha G, Sanjai P.A.')">Help</div>
            </div>

            <!-- Content Area: React Root -->
            <div class="win95-content-area">
                <div id="techastra-admin-root"></div>
            </div>

            <!-- Status Bar -->
            <div class="win95-statusbar">
                <div class="win95-status-panel flex-1">● RESTRICTED AREA // AUTHORIZED PERSONNEL ONLY</div>
                <div class="win95-status-panel">STATION: TECHASTRA-HQ-01</div>
                <div class="win95-status-panel">SERVER: CONNECTED</div>
                <div class="win95-status-panel" id="admin-clock">--:--:--</div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const el = document.getElementById('admin-clock');
            if (el) el.textContent = new Date().toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
    <script src="admin.bundle.js"></script>
    <script>
        function ensureAdminMounted() {
            var root = document.getElementById('techastra-admin-root');
            if (root && (!root.innerHTML || root.innerHTML.trim() === '') && window.mountTechastraAdmin) {
                console.log('Ensuring Techastra Admin mounting...');
                window.mountTechastraAdmin(root);
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', ensureAdminMounted);
        } else {
            ensureAdminMounted();
        }
        window.addEventListener('load', ensureAdminMounted);
    </script>
</body>
</html>
